    title_pipe_to_dash: true                # the guide's "|" separator is illegal in Windows file names
    # Shared horror/mystery pack (user 2026-10-07): Đạo Sĩ's horror stingers without the comedy files + 19
    # Kẻ Trừ Tà foley files (ktt-*). Default pack for new horror / mystery series; Đạo Sĩ is complete and keeps dao-si.
