    # Tập NN = chương (NN-1)*12+1 .. NN*12; Tập 29 = 337-356 (20 chương). 356 chương, 29 tập (user 2026-10-07).
    srt_chapter_numbering: absolute         # checked in Tap_02_Ch013-Ch024_vi_qa.srt: headings read "Chương 13"…"Chương 24"
    cta:
      intro: "CTA voice/cta-intro-v2.mp4"   # 15.49s, Remotion + OmniVoice clone of linhdi-2 (2026-10-07)
      outro: "CTA voice/cta-outro-v2.mp4"   # 16.81s
      set_cta_image: false                  # a still would override the animated clip
    # No description_base yet: Tập 1 builds its template from Đạo Sĩ's rendered description (same channel, same
