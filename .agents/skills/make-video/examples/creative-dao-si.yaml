# Narration 4978,06s (82,97 phút) — WAV 24kHz mono 16-bit, khớp đúng end cue cuối của SRT.
# CTA: intro v2 (16,853s) + OUTRO RIÊNG TẬP CUỐI `cta-outro-v2-final.mp4` (cùng hình v2, lời cảm ơn
# trọn bộ 38 tập thay cho "hẹn gặp lại tập sau" — user duyệt 2026-09-13).
