    # Gap nhỏ nhất 35,5s (≥30). Cue đầu 134,24s (≥30); cue cuối 4885,86s (< 4975,06−25).
    # Pin bằng nội suy ký tự trong cue SRT; gain theo max_volume đo được để đỉnh ≈ −16 dBFS
    # (whisper/bed-dài eerie wind thấp hơn để không lấn giọng đọc).
