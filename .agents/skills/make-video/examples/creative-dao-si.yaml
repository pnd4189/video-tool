  description: >-
    Thân thể còn chưa mọc lại, Mã Lực Thuật đã phải trơ mắt nhìn Tam Nương mê tít chiếc điện thoại
    màn hình xanh, còn một tia sét giáng xuống ngay bên cạnh khiến cô tin sái cổ đó là "pháp bảo"
    hút sét. Lạc vào sảnh dát vàng không cửa không lối thoát, cậu gặp lại Mã Kiến Dân đang chia tiền
    cá cược cho đám người "tẩu hỏa nhập ma", và lão lái đò đội nón lá ngủ gật trong góc chính là
    trái tim của Nơi Cực Âm - thứ họ đã thất bại 3768 lần vẫn không diệt nổi. Rồi Cải Mệnh Nhân mở
    cuốn Thiên Thư, hé lộ chân tướng về chính sự ra đời của Mã Lực Thuật. Nghe ngay Tập 38 - tập cuối!
  recap_previous: >-
    Bị chém rơi đầu hết lần này tới lần khác, Mã Lực Thuật lạc về căn lầu hai thời anh em Quan Hưng
    còn sống, rồi tỉnh dậy với thân hình tí hon trong biệt thự tây nhà họ Khổng, nơi gã trung niên
    lật mặt và bị bảy tám bóng ma chết đuối lôi xuống bùn đen. Để cứu Khổng Đình khỏi ả nha hoàn
    Tiểu Hồng, cậu nhờ Ma Đầu Lâu chặt phăng đầu mình rồi ngậm tóc bay lên tầng hai, nào ngờ vừa nở
    nụ cười thân thiện, Khổng Đình đã lăn ra ngất, còn cái đầu cậu bị ném vụt qua cửa sổ. Ngậm chặt
    cành cây giữa trời, cậu bị Tam Nương trêu cho rơi xuống - và người đỡ lấy cậu lại chính là Vân Mỹ.
