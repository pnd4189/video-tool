# Bình Thiên Sách — Tập 54 (chương 646-660), voice 8650,76s = 2h24m11 (SRT 1247 cue, WAV 24kHz mono)
# Vượt sông băng + bình nguyên Lan Chi vào đất phong Tế Phong; thành Nham Dương trên đồi đá đen;
# Hạ Ba Dực (Biên Bức Công Tử) đã ngồi sẵn trong thành; canh cược ở bãi điểm binh đêm lửa trại:
# 6 Thần Vương Tê + 6 Kim Sơn Tượng, Tổ Xà vượt tường thành, Lâm Ý tay không đọ voi, Tử Mẫu kiếm
# đánh lén, Hạ Ba Tư ngân cầu; Tế Phong Hồng Tề "quay giáo" (nỏ công thành + chân nguyên trọng khải
# + khinh khí cầu thả lưới), giao binh quyền, bàn về hỏa khí vs xe nước.
# SRT đánh số chương thật 646-660, 15/15 tên khớp qa.txt -> không renumber. Tên chương giữ đúng
# qa.txt (tập này không có dấu chấm cuối). Không có scene plan -> timing `even` như BT47-53.
# Overlay ember-gen-01 (tia lửa cam ~140 hạt/frame, maxRGB ~150/75/28, YAVG 16,1 = nhẹ): khớp
# thao trường đêm rực lửa trại (652-658 là lõi tập) + mo-típ hỏa khí của tộc Hạ Ba xuyên suốt;
# đổi hẳn khỏi 2 tập tuyết liền trước (snow-ffc-04 t52, snow-ffc-02 t53). Lấy từ kho có sẵn.
# TPU (user chỉ định): 255 scene ước ~55-75ph render như BT53.

project:
  title: "Bình Thiên Sách Tập 54: Tay Không Đấm Vỡ Thần Tượng!"
  description: |-
    Vượt qua những dòng sông băng xanh đen trên nóc nhà Đảng Hạng, Lâm Ý theo chân Tế Phong Anh Sơn tiến thẳng tới thành Nham Dương — nơi vị tam thúc mặt hiền như thương nhân đang tiếp đón một vị khách còn nguy hiểm hơn cả Thiết Sách quân. Giữa bãi điểm binh lạnh giá dưới ánh lửa trại, niềm kiêu hãnh của tộc Hạ Ba lần lượt bước ra: những con cự thú bọc giáp mà cả vương tộc Đảng Hạng cũng phải kiêng dè. Nhưng đêm ấy, thứ đáng sợ nhất trong tòa thành trên đồi đá đen lại không nằm ở bãi điểm binh.
  recap_previous: |-
    Trên sườn núi cao nguyên Đảng Hạng, Lâm Ý đặt ra một canh cược khiến chính đội quân ba ngàn người đang vây quanh hắn phải lặng người: một mình hắn tiếp nhận toàn bộ thủ đoạn của họ, và nếu không ai làm gì được hắn, tất cả phải đầu hàng. Biển lửa hỏa khí bùng lên từ canh cược ấy mới chỉ là khởi đầu — giữa lòng động Hồng Diêm, bức màn chính trị của tám vương tộc, thế lực hỏa khí Hạ Ba thị và cả một kẻ bán đứng quân tình ngay trong Nam triều lần lượt hé lộ. Trong bóng tối những xưởng muối, Thiết Sách quân lần đầu khoác lên mình bộ quân giới trắng tuyết, sẵn sàng cùng những người bạn mới bước vào sâu trong lãnh thổ Đảng Hạng.
  chapters:
    - {start: 0.0,     title: "Chương 646: Đoạt linh"}
    - {start: 739.18,  title: "Chương 647: Lời nói thật"}
