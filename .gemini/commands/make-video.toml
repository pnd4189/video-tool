description = "Build an audio-story YouTube video end-to-end from an asset folder. Reads AGENTS.md for workflow + pitfalls + confirmed decisions."
argument-hint = "<folder> [optional hints: title, music file, presets, language]"

prompt = """\
Read `./AGENTS.md` first — it contains the workflow, pitfalls, and confirmed decisions for this project. Treat its "Confirmed project decisions" as locked unless the user explicitly asks to change one.

Then execute the standard 4-step pipeline against the user's input:

$ARGUMENTS

## Execution rules

1. Inspect the asset folder. Identify the voice file, image files, optional video clips (.mp4/.mov), the music folder, intro/ending images, a `*_vi.txt` script, and a `_DESCRIPTION_TEMPLATE.txt`. Use absolute paths.
2. Run `init-job`, then patch `job.yaml`: `assets.policy: allow-missing-local`, `captions.mode: off`, intro/ending when detected. Channel default = `enhance: {visualizer: true, subtitles: true, progress_bar: false}`. Set `inputs.script` to the `*_vi.txt` and `inputs.description_template` to the `_DESCRIPTION_TEMPLATE.txt` (must hold `{{CHAPTERS}}`/`{{RECAP_PREV}}`/`{{SUMMARY}}`). Author `project.recap_previous` (prev tập) + `project.description` (this tập) from the vi.txt.
3. Run `storyboard auto` for images. If the folder also contains video clips, append them manually to the storyboard list in `job.yaml` (autogen skips videos — Pitfall #2).
4. Subtitles are on → if `outputs/captions.srt` is missing, run `transcribe "$JOB" --model base` first (aligns to script, emits `outputs/chapters.json`). Warn it may take minutes on long audio; run automatically.
5. `validate` → `render --preset youtube-16x9 --enhance full` → `package` (renders `description.txt` from template with chapters + recap + summary). Shorts only if hint asks.
6. Report mp4 paths, thumbnail, `description.txt`, chapter count, one-line summary. Remind user to paste `description.txt` into the YouTube description for native chapters. Quote any `ffprobe` codec check.

## When to pause

Only ask ONE concise question, and only if essential:
- No voice file detectable in the folder
- Multiple candidate voice/music files and the hint doesn't disambiguate
- Folder has zero images AND zero video clips (nothing to render)

Otherwise run silently end-to-end and report at the end.
"""
