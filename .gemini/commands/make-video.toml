description = "Build an audio-story YouTube video end-to-end from an asset folder. Reads AGENTS.md for workflow + pitfalls + confirmed decisions."
argument-hint = "<folder> [optional hints: title, music file, presets, language]"

prompt = """\
Read `./AGENTS.md` first — it contains the workflow, pitfalls, and confirmed decisions for this project. Treat its "Confirmed project decisions" as locked unless the user explicitly asks to change one.

Then execute the standard 4-step pipeline against the user's input:

$ARGUMENTS

## Execution rules

1. Inspect the asset folder. Identify the voice file, image files, optional video clips (.mp4/.mov), the music folder, intro/ending images, a `*_vi.txt` script, a `_DESCRIPTION_TEMPLATE.txt`, and a `CTA voice/` folder (`Intro CTA.*` / `Outro CTA.*`). Use absolute paths.
2. Run `init-job`, then patch `job.yaml`: `assets.policy: allow-missing-local`, `captions.mode: off`, intro/ending when detected. Channel default = `enhance: {visualizer: true, subtitles: true, progress_bar: false}`. Set `inputs.script`=`*_vi.txt`, `inputs.description_template`=`_DESCRIPTION_TEMPLATE.txt` (must hold `{{CHAPTERS}}`/`{{RECAP_PREV}}`/`{{SUMMARY}}`). When `CTA voice/` exists set `inputs.intro_cta`/`outro_cta` + `inputs.intro_cta_image` (thumbnail)/`outro_cta_image` (ending) — tool splices at start/end, auto-shifts captions+chapters (adds 00:00 "Giới thiệu"). Author `project.recap_previous` (prev tập) + `project.description` (this tập) from the vi.txt.
3. Run `storyboard auto` for images. If the folder also contains video clips, append them manually to the storyboard list in `job.yaml` (autogen skips videos — Pitfall #2).
4. Subtitles are on → if `outputs/captions.srt` is missing, run `transcribe "$JOB" --model "$HOME/.cache/videotool/models/faster-whisper-base"` first (PATH, not bare `base`; aligns to script, emits `outputs/chapters.json`). Warn it may take minutes on long audio; run automatically.
5. `validate` → `render --preset youtube-16x9` → `package` (per-feature `enhance` drives overlays; do NOT pass `--enhance full` — adds particles). Shorts only if hint asks.
6. Report mp4 paths, thumbnail, `description.txt`, chapter count, one-line summary. Remind user to paste `description.txt` into the YouTube description for native chapters. Quote any `ffprobe` codec check.

## When to pause

Only ask ONE concise question, and only if essential:
- No voice file detectable in the folder
- Multiple candidate voice/music files and the hint doesn't disambiguate
- Folder has zero images AND zero video clips (nothing to render)

Otherwise run silently end-to-end and report at the end.
"""
