[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videotool"
version = "0.1.0"
description = "Local audio-first video composer with FFmpeg, subtitles, asset licenses, and YouTube package checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
ai = ["faster-whisper>=1.0"]
gui = ["fastapi>=0.111", "jinja2>=3.1", "uvicorn>=0.30"]
dev = ["pytest>=8.2"]

[project.scripts]
videotool = "videotool.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/videotool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
